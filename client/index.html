<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gielinor Bosses</title>
    <meta name="description" content="A field guide to the bosses of RuneScape." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/scripts/header.js"></script>
    <script type="module" src="/scripts/bosses.js"></script>
</head>

<body>
    <header class="container"></header>
    <main id="main-content" class="container">
        <!-- A plain GET form: submitting loads /?search=...&tier=..., so every
             search has its own URL and the back button works. autocomplete="off"
             stops the browser restoring stale field values on Back; the script
             fills the form from the URL instead. -->
        <form role="search" action="/" method="get" class="boss-search" autocomplete="off">
            <input type="search" name="search" placeholder="Search by name, location or drop"
                aria-label="Search bosses by name, location or drop" />
            <select name="tier" aria-label="Filter by tier">
                <option value="">All tiers</option>
                <option value="Low">Low</option>
                <option value="Mid">Mid</option>
                <option value="High">High</option>
                <option value="Elite">Elite</option>
            </select>
            <button type="submit">Search</button>
        </form>
        <section id="boss-results"></section>
    </main>
    <footer class="container"></footer>
</body>

</html>
